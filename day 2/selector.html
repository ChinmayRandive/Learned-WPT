<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="selector.css">
    <style>
        /Element Selector/
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
            background-color: lightcyan;
        }
        h3 {
            color: blue;
            font-size: 30px;
        }
        h4 {
            color: green;
            font-size: 25px;
        }
        /Group Selector/
        b,strong,em {
            color: red;
            font-size: 20px;
        }
        /Class Selector/
        .cls1 {
            color: orange;
            font-size: 15px;
        }
        /ID Selector/
        #d4 {
            color: purple;
            font-size: 20px;
        }
        /Universal Selector/
        div {
            background-color: lightgrey;
        }
    </style>
</head>
<body>
    <h3>Pune</h3>
    <h4>Mumbai</h4>
    <b>Rajesh</b>
    <strong>Jack Sparrow</strong>
    <em>Luffy</em>
    <div class="cls1">This is class 1</div>
    <div class="cls1">This is class 2</div>
    <div class="cls1">This is class 3</div>
    <div id="d4">This is class 4</div>
    <div >This is class 5</div>
    <div >This is class 6</div>

</body>
</html>
